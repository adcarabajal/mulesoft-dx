# Kind-specific overlay for kube-prometheus-stack: kind has no node-role labels
# and hostNetwork collides with the kindnet stack, so flatten everything.
grafana:
  nodeSelector: {}
  tolerations: []

prometheus:
  prometheusSpec:
    nodeSelector: {}
    tolerations: []

kube-state-metrics:
  nodeSelector: {}
  tolerations: []

prometheus-node-exporter:
  hostNetwork: false
